<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぱずぎり備忘録</title>
    <!-- Bootstrap@5.3.0 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  
<body>
  <!-- ヘッダー -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom border-1">
    <div class="container-fluid px-2 px-sm-3 d-flex flex-column align-items-start">
      <div class="d-flex align-items-center flex-wrap">
        <a href="#" class="d-flex align-items-center text-decoration-none header-action" style="cursor: pointer;">
          <i class="bi bi-flower3 fs-2 text-danger m-0 me-0"></i>
          <p class="header m-0 fs-3 py-0">ぱずぎり備忘録</p></a>
      </div>
    </div>
  </nav>
  <div class="header-border"></div>
  <!-- ボタン設定 -->
  <div class="button-section">
    <div class="d-flex justify-content-center flex-wrap px-2">
      <button class="button active" data-json-key="現在">現在開催中</button><p class="d-flex align-items-center mb-0">|　</p>
      <button class="button active" data-json-key="全て">すべて</button>
      <button class="button" data-json-key="召喚">召喚</button>
      <button class="button" data-json-key="イベント">イベント</button>
    </div>
  </div>
  <div id="main-content-area">
    <div class="container mb-3">
      <div class="d-flex justify-content-end px-2" style="max-width: 700px; margin: 0 auto; width: 100%;">
        <select id="sortOrder" class="form-select-sm border-" style="border-radius: 4px; color: #555; border-color: #ced4da; background-color: #fff; cursor: pointer;">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
        </select>
      </div>
    </div>
    <!-- コンテナ (container) -->
    <div id="CardConteiner" class="CardConteiner">
      <div class="Card">
        <img src="" alt="">
        <div class="Card-text">
          <p class="Card-title"></p>
          <p class="Card-date"></p>
        </div>
      </div>
    </div>
  </div>
  <div id="detail-viewer" style="display: none; padding: 10px; max-width: 800px; margin: 0 auto;"></div>

  <!-- フッター -->
  <footer class="py-4 mt-auto footer">
    <p class="footer mb-0">
      Background Image by <a href="https://ja.pngtree.com/freepng/hand-drawn-cartoon-cherry-petals-floating-free-buckle-element_4431467.html" class="footer">ja.pngtree.com</a><br>
      衿緒 <a href="https://twitter.com/ERIO151235/" class="footer">@ERIO151235</a>
    </p>
  </footer>
  
  <!-- script.js -->
  <script src="script.js">
  </script>
</body>
</html>
